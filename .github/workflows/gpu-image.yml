name: GPU image

# Builds the GPU images on every push to the gpu branch and publishes them to ghcr.io/<owner>/<repo>:
# - Dockerfile "base" target as :latest, :<MediaCMS version> and :sha-<commit>
# - Dockerfile "full" target (adds Whisper transcription) as :full, :<version>-full and :sha-<commit>-full
#
# Optional Docker Hub mirror: add a repository variable DOCKERHUB_USERNAME and a
# repository secret DOCKERHUB_TOKEN (Docker Hub access token, read/write) and the
# same tags are also pushed to docker.io/<DOCKERHUB_USERNAME>/mediacms-gpu.

on:
  push:
    branches:
      - gpu
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gpu-image
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_USERNAME != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read MediaCMS version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Docker meta for base image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME || 'disabled' }}/mediacms-gpu,enable=${{ env.DOCKERHUB_ENABLED }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=MediaCMS GPU
            org.opencontainers.image.description=MediaCMS with NVIDIA NVENC/CUVID encoding (Jellyfin ffmpeg)
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Docker meta for full image
        id: meta-full
        uses: docker/metadata-action@v6
        with:
          images: |
            name=ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME || 'disabled' }}/mediacms-gpu,enable=${{ env.DOCKERHUB_ENABLED }}
          tags: |
            type=raw,value=full
            type=raw,value=${{ steps.version.outputs.version }}-full
            type=sha,prefix=sha-,suffix=-full
          labels: |
            org.opencontainers.image.title=MediaCMS GPU (full)
            org.opencontainers.image.description=MediaCMS with NVIDIA NVENC/CUVID encoding (Jellyfin ffmpeg) and Whisper transcription
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reuses the base layers built above; the Whisper layer is too large to keep in the GHA cache.
      - name: Build and push full image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: type=gha
